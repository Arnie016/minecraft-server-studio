name: Ashfall Workshop
on:
  push:
    branches: [main, feat/pack-foundry-v0.1.0]
    paths: ['pack-foundry/**', '.github/workflows/pack-foundry.yml']
  pull_request:
    paths: ['pack-foundry/**', '.github/workflows/pack-foundry.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the versioned alpha release with signed build provenance'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python pack-foundry/tools/build.py
      - run: python -m unittest discover -s pack-foundry/tests -p test_release.py -v
      - run: pip install -r pack-foundry/requirements.txt playwright==1.63.0
      - run: python pack-foundry/tests/test_mcp.py
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python pack-foundry/tests/test_web.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ashfall-workshop-preview
          path: |
            pack-foundry/site/
            pack-foundry/verification/
  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/pack-foundry-v0.1.0')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python pack-foundry/tools/build.py
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'pack-foundry/dist/*'
      - name: Verify repository-bound signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in pack-foundry/dist/*.zip; do
            gh attestation verify "$artifact" -R "$GITHUB_REPOSITORY"
          done
      - name: Publish immutable-version alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("pack-foundry/catalog.source.json"))["version"])')
          TAG="workshop-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its assets. Increment source version for a new release."
            exit 0
          fi
          gh release create "$TAG" pack-foundry/dist/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Ashfall Workshop $VERSION · Java 1.21.1 alpha" \
            --notes-file pack-foundry/docs/RELEASE_NOTES.md
