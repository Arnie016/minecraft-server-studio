name: Ashfall Bridge Lab
on:
  push:
    branches: [feat/bridge-lab]
    paths: ['bridge-lab/**', '.github/workflows/bridge-lab.yml']
  pull_request:
    paths: ['bridge-lab/**', '.github/workflows/bridge-lab.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s bridge-lab -p 'test_bridge.py' -v
      - run: python bridge-lab/bridge.py demo
      - run: pip install -r bridge-lab/requirements.txt
      - run: python bridge-lab/check_mcp.py
